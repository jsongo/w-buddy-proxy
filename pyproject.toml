[project]
name = "w-buddy-proxy"
version = "2.0.4"
description = "Local OpenAI/Responses/Anthropic compatible proxy for CodeBuddy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "httpx[socks]>=0.25.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
w-buddy-proxy = "codebuddy_proxy.__main__:main"
codebuddy-proxy = "codebuddy_proxy.__main__:main"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codebuddy_proxy = ["models_config.json"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test_endpoints_smoke.py"]
